<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model Viewer — Next/Previous</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }

      .arrow {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2rem;
        color: white;
        background: rgba(0, 0, 0, 0.4);
        padding: 0.5em 0.8em;
        border-radius: 50%;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s;
      }

      .arrow:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .arrow.left {
        left: 1rem;
      }

      .arrow.right {
        right: 1rem;
      }

      .label {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: sans-serif;
        font-size: 1rem;
        background: rgba(0, 0, 0, 0.5);
        padding: 0.4em 1em;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="viewer"
      src="OG-ATVM.glb"
      alt="3D model"
      auto-rotate
      camera-controls
      rotation-per-second="30deg"
      ar
      shadow-intensity="12"
      exposure="0.5"
      environment-image="legacy"
    ></model-viewer>

    <div class="arrow left" id="prevBtn">◀</div>
    <div class="arrow right" id="nextBtn">▶</div>
    <div class="label" id="label"></div>

    <script>
      const viewer = document.getElementById("viewer");
      const label = document.getElementById("label");

      // You can use GLB, GLTF, or OBJ files
      const models = [
        {
          name: "A",
          url: "OG-ATVM.glb",
        },
        {
          name: "B",
          url: "VERTICAL-ATVM.glb",
        },
        {
          name: "C",
          url: "OG-ATVM-PRIVATE.glb",
        },
        {
          name: "D",
          url: "VERTICAL-ATVM-PRIVATE.glb",
        },
      ];
      let index = 0;

      function updateModel() {
        viewer.pause(); // stop rendering temporarily
        viewer.src = models[index].url;
        label.textContent = `${models[index].name} (${index + 1}/${
          models.length
        })`;

        viewer.resetTurntableRotation();
        viewer.cameraOrbit = "0deg 75deg 14m";

        viewer.play(); // resume auto-rotation
      }

      document.getElementById("prevBtn").onclick = () => {
        index = (index - 1 + models.length) % models.length;
        updateModel();
      };
      document.getElementById("nextBtn").onclick = () => {
        index = (index + 1) % models.length;
        updateModel();
      };

      updateModel();
    </script>
  </body>
</html>
