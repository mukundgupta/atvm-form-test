<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATVM Form Factor Test</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }

      .arrow {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2rem;
        color: white;
        background: rgba(0, 0, 0, 0.4);
        padding: 0.5em 0.8em;
        border-radius: 50%;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s;
      }

      .arrow:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .arrow.left {
        left: 1rem;
      }

      .arrow.right {
        right: 1rem;
      }

      .label {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: sans-serif;
        font-size: 1rem;
        background: rgba(0, 0, 0, 0.5);
        padding: 0.4em 1em;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="viewer"
      src="OG-ATVM.glb"
      alt="3D model"
      camera-controls
      ar
      shadow-intensity="12"
      exposure="0.5"
      environment-image="legacy"
      min-camera-orbit="-80deg 10deg auto"
      max-camera-orbit="80deg 170deg auto"
    ></model-viewer>

    <div class="arrow left" id="prevBtn">◀</div>
    <div class="arrow right" id="nextBtn">▶</div>
    <div class="label" id="label"></div>

    <script>
      const viewer = document.getElementById("viewer");
      const label = document.getElementById("label");

      const models = [
        { name: "C", url: "WALL-LIB-ATVM.glb", orbitRadius: "14m" },
        { name: "D", url: "WALL-SLAB-ALT-ATVM.glb", orbitRadius: "14m" },
        { name: "E", url: "WALL-POKE-ATVM.glb", orbitRadius: "14m" },
        { name: "ALL", url: "ALL.glb", orbitRadius: "14m" },
      ];

      let index = 0;
      let theta = 0;
      let direction = 1;
      const speed = 0.2;
      const limit = 90;
      let currentRadius = models[0].orbitRadius; // start with first model

      function updateModel() {
        const model = models[index];
        viewer.src = model.url;
        label.textContent = `${model.name} (${index + 1}/${models.length})`;

        // wait for model to load before applying orbit
        viewer.addEventListener(
          "load",
          () => {
            currentRadius = model.orbitRadius;
            theta = 0; // reset rotation
            viewer.cameraOrbit = `${theta}deg 75deg ${currentRadius}`;
          },
          { once: true }
        );
      }
      let isDragging = false;
      let dragTimeout;

      viewer.addEventListener("camera-change", () => {
        isDragging = true;

        // Clear previous timeout
        if (dragTimeout) clearTimeout(dragTimeout);

        // Wait 1s after the last camera-change event to resume auto-rotate
        dragTimeout = setTimeout(() => {
          isDragging = false;
        }, 1000);
      });

      function animate() {
        if (!isDragging) {
          theta += direction * speed;
          if (theta > limit || theta < -limit) direction *= -1;

          viewer.cameraOrbit = `${theta}deg 75deg ${currentRadius}`;
        }

        requestAnimationFrame(animate);
      }

      document.getElementById("prevBtn").onclick = () => {
        index = (index - 1 + models.length) % models.length;
        updateModel();
      };
      document.getElementById("nextBtn").onclick = () => {
        index = (index + 1) % models.length;
        updateModel();
      };

      animate();
      updateModel();
    </script>
  </body>
</html>
